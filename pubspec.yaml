name: rewire
description: "Rewire - instrument de gestionare a impulsurilor si dependentelor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  uuid: ^4.0.0

  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  connectivity_plus: ^6.0.0

  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.0

  cupertino_icons: ^1.0.6
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/sounds/
    - assets/images/
